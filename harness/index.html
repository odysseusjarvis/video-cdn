<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollScrubber harness</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="/images/car/frames/frame-00.jpg" fetchpriority="high" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b0b0c; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; }
      .pad { padding: 4rem 1.5rem; max-width: 60ch; margin: 0 auto; }
      .hud {
        position: fixed; top: 8px; left: 8px; z-index: 99;
        background: rgba(0,0,0,.8); padding: 6px 10px; border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace; white-space: pre;
      }
      .badge {
        position: absolute; bottom: 6vh; left: 50%;
        transform: translate3d(-50%, calc((1 - var(--pw-progress, 0)) * 40px), 0);
        opacity: var(--pw-progress, 0);
        background: rgba(255,255,255,.9); color: #111; padding: .5rem 1rem; border-radius: 999px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
